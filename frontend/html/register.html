<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriSmart Register</title>
    <link rel="manifest" href="../pwa/manifest.json" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <h1>Create your account</h1>
        <p>Join AgriSmart to manage crops, livestock, and ponds.</p>
        <form id="authForm">
          <input id="name" placeholder="Full name" required />
          <input id="email" type="email" placeholder="Email" required />
          <input id="password" type="password" placeholder="Password" required />
          <select id="role">
            <option value="farmer">Farmer</option>
            <option value="expert">Expert</option>
            <option value="admin">Admin</option>
          </select>
          <input id="location" placeholder="Location" />
          <input id="farmName" placeholder="Farm or pond name" />
          <button type="submit">Create account</button>
        </form>
        <p id="message"></p>
      </div>
    </div>

    <script src="../js/config/api.js"></script>
    <script src="../js/auth/register.js"></script>
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('../pwa/service-worker.js');</script>
  </body>
</html>
